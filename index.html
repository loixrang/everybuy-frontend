<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { min-height: 100%; background: #FAFAF7; color: #242B25; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #0A0B0A; color: #F3F5F1; }
    </style>
    <script>
      (function () {
        var preference = 'device';
        try {
          var saved = localStorage.getItem('everybuy-theme');
          if (saved === 'light' || saved === 'dark' || saved === 'device') preference = saved;
        } catch (_) {}
        var dark = preference === 'dark' || (preference === 'device' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="theme-color" content="#365E48" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0A0B0A"
    />
    <meta
      name="description"
      content="Everybuy is a secure shop operations app for managing inventory, sales, customer balances, expenses and stock movements."
    />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="application-name" content="Everybuy" />
    <title>Everybuy | Shop inventory and sales management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
