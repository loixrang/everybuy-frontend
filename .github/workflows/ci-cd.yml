name: Frontend CI/CD

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://localhost:3000' }}
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test

      - name: Production build
        run: bun run build

      - name: Add SPA fallback for Pages
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: cp dist/index.html dist/404.html

      - name: Save deployable site artifact
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@v7
        with:
          name: everybuy-frontend-site
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch &&
      vars.VITE_API_BASE_URL != '' &&
      vars.VITE_BASE_PATH != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Download verified site artifact
        uses: actions/download-artifact@v7
        with:
          name: everybuy-frontend-site
          path: dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
